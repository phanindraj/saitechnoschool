<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student - Sai Techno School</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { color: #333; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #666; font-weight: 600; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:disabled { background-color: #a0c4ff; cursor: not-allowed; }
    .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; text-align: center; font-size: 14px; }
    .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .nav-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>Add New Student</h2>
  
  <div id="alertBox" class="alert"></div>

  <form id="addStudentForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="John Doe">
    </div>

    <div class="form-group">
      <label for="rollNo">Roll Number</label>
      <input type="text" id="rollNo" name="rollNo" required placeholder="ST101">
    </div>

    <div class="form-group">
      <label for="class">Class / Grade</label>
      <input type="text" id="class" name="class" required placeholder="Class 10">
    </div>

    <div class="form-group">
      <label for="section">Section</label>
      <input type="text" id="section" name="section" placeholder="A">
    </div>

    <button type="submit" id="submitBtn">Save Student Record</button>
  </form>

  <a href="students.html" class="nav-link">View All Students Directory &rarr;</a>
</div>

<script>
  // Automatic URL Detection: Use localhost when developing, Render when live
  const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:3000' 
    : 'https://saitechnoschool.onrender.com';

  const studentForm = document.getElementById('addStudentForm');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');

  function showAlert(message, type) {
    alertBox.className = `alert alert-${type}`;
    alertBox.innerText = message;
    alertBox.style.display = 'block';
  }

  studentForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    // UI Loading state
    submitBtn.disabled = true;
    submitBtn.innerText = 'Saving to Database (may take 30s if waking up)...';
    alertBox.style.display = 'none';

    const formData = new FormData(studentForm);
    const payload = Object.fromEntries(formData.entries());

    try {
      const response = await fetch(`${API_BASE_URL}/api/add-student`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        showAlert('Student record added successfully!', 'success');
        studentForm.reset();
      } else {
        throw new Error(data.error || 'Failed to add student.');
      }
    } catch (err) {
      console.error('Submission Error:', err);
      showAlert(err.message || 'Error connecting to the backend server.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Save Student Record';
    }
  });
</script>

</body>
</html>
