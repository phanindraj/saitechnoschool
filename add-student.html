<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Student - Sai Techno School</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo-container">
      <img src="images/logo.jpeg" alt="Sai Techno School Logo" class="brand-logo" />
      <div class="brand-text">
        <span class="school-name">SAI TECHNO SCHOOL</span>
        <span class="school-tagline">INSPIRING THE CURIOUS</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="students.html">Student Directory</a></li>
      <li><a href="add-student.html" class="active">Add Student</a></li>
    </ul>
  </nav>

  <section class="directory-hero">
    <h1>Student Entry Form</h1>
    <p>Enter student details below to save them directly to the server in <strong>student/student.txt</strong>.</p>
  </section>

  <section class="directory-section">
    <div style="max-width: 650px; margin: 0 auto;">
      <!-- Form posts directly to the Express server route -->
      <form class="contact-form" action="/api/add-student" method="POST">
        <h3>New Student Registration</h3>

        <div class="input-group">
          <input type="text" name="rollNo" placeholder="Roll Number (e.g., STS-2026-05)" required />
        </div>

        <div class="input-group">
          <input type="text" name="name" placeholder="Student Full Name" required />
        </div>

        <div class="input-group">
          <input type="text" name="dob" placeholder="Date of Birth (DD/MM/YYYY)" required />
        </div>

        <div class="input-group">
          <input type="text" name="classSec" placeholder="Class & Section (e.g., Class 8 - A)" required />
        </div>

        <div class="input-group">
          <input type="text" name="guardian" placeholder="Parent / Guardian Name" required />
        </div>

        <div class="input-group">
          <input type="tel" name="contact" placeholder="Contact Mobile Number" required />
        </div>

        <div class="input-group">
          <select name="grade" class="styled-select" required>
            <option value="" disabled selected>Select Performance Grade</option>
            <option value="Grade A+">Grade A+</option>
            <option value="Grade A">Grade A</option>
            <option value="Grade B">Grade B</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Save Student Details <i data-lucide="user-plus"></i></button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Sai Techno School. All Rights Reserved.</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
